<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Symple Audio Splitter — 音声をブラウザで分割</title>
    <meta
      name="description"
      content="mp3 / m4a の音声ファイルをブラウザだけで分割。分割線の追加、均等分割、無音検出、オーバーラップ、プレビュー再生に対応。ファイルはアップロードされません。"
    />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Audio Splitter" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M3 12h2M8 7v10M12 4v16M16 9v6M20 12h1" />
            </svg>
          </span>
          <div class="brand-text">
            <h1>Symple Audio Splitter</h1>
            <p>音声をブラウザだけで分割</p>
          </div>
        </div>
        <button id="install-btn" class="btn btn-ghost btn-sm" type="button" hidden>
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3v12M7 10l5 5 5-5M4 21h16" />
          </svg>
          インストール
        </button>
      </header>

      <main>
        <section id="dropzone" class="card dropzone">
          <input
            type="file"
            id="file-input"
            accept="audio/*,.mp3,.m4a,.mp4,.wav,.aac,.ogg,.oga,.flac,.opus,.webm"
            hidden
          />
          <div class="dz-inner">
            <span class="dz-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 16V4M7 9l5-5 5 5" />
                <path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3" />
              </svg>
            </span>
            <p class="dz-title">音声ファイルをドロップ</p>
            <p class="dz-sub">mp3 / m4a 対応 ・ ファイルはサーバーに送信されません</p>
            <button class="btn btn-primary" id="pick-btn" type="button">ファイルを選択</button>
          </div>
        </section>

        <section id="workspace" hidden>
          <div class="card filebar">
            <div class="filebar-main">
              <span class="file-name" id="file-name"></span>
              <span class="file-meta" id="file-meta"></span>
            </div>
            <button class="btn btn-ghost btn-sm" id="change-file" type="button">別のファイル</button>
          </div>

          <div class="card wavecard">
            <div class="wave-toolbar">
              <button id="play-btn" class="btn btn-icon" type="button" title="再生 / 停止 (Space)" aria-label="再生">
                <svg class="icon-play" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z" /></svg>
                <svg class="icon-stop" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true" hidden><rect x="7" y="6" width="10" height="12" rx="1.5" /></svg>
              </button>
              <span class="time-display"><span id="cur-time">0:00.0</span><span class="time-sep">/</span><span id="dur-time">0:00.0</span></span>
              <span class="spacer"></span>
              <button id="zoom-out" class="btn btn-icon" type="button" title="縮小" aria-label="縮小">−</button>
              <button id="zoom-in" class="btn btn-icon" type="button" title="拡大" aria-label="拡大">＋</button>
              <button id="zoom-fit" class="btn btn-ghost btn-sm" type="button">全体</button>
            </div>
            <div class="wave-wrap">
              <canvas id="wave" aria-label="波形"></canvas>
            </div>
            <input type="range" id="pan" class="pan" min="0" max="1000" value="0" step="1" hidden aria-label="表示位置" />
            <p class="hint">
              クリックで再生位置を移動 ・ ダブルクリックで分割線を追加 ・ 分割線はドラッグで移動、上部の × で削除
            </p>
          </div>

          <div class="card splitcard">
            <div class="tabs" role="tablist">
              <button class="tab is-active" data-tab="manual" role="tab" type="button">手動</button>
              <button class="tab" data-tab="equal" role="tab" type="button">均等分割</button>
              <button class="tab" data-tab="silence" role="tab" type="button">無音検出</button>
            </div>

            <div class="tab-panel" data-panel="manual">
              <div class="row">
                <button class="btn btn-primary" id="add-split" type="button">＋ 現在位置に分割線を追加</button>
                <button class="btn btn-ghost" id="clear-splits" type="button">すべて削除</button>
              </div>
              <p class="hint">分割線 <strong id="split-count">0</strong> 本</p>
            </div>

            <div class="tab-panel" data-panel="equal" hidden>
              <div class="row">
                <label class="field">分割数
                  <input type="number" id="equal-count" min="2" max="200" step="1" value="4" inputmode="numeric" />
                </label>
                <button class="btn btn-primary" id="apply-equal" type="button">均等に分割</button>
              </div>
              <p class="hint">現在の分割線を置き換えます。</p>
            </div>

            <div class="tab-panel" data-panel="silence" hidden>
              <div class="row">
                <label class="field">しきい値
                  <input type="number" id="sil-threshold" value="-40" step="1" inputmode="numeric" />
                  <span class="unit">dB</span>
                </label>
                <label class="field">最短無音
                  <input type="number" id="sil-min" value="300" step="50" min="50" inputmode="numeric" />
                  <span class="unit">ms</span>
                </label>
                <label class="field">最短の長さ
                  <input type="number" id="sil-minseg" value="1000" step="100" min="100" inputmode="numeric" />
                  <span class="unit">ms</span>
                </label>
                <button class="btn btn-primary" id="apply-silence" type="button">検出して分割</button>
              </div>
              <p class="hint">無音区間の中央で分割します。現在の分割線を置き換えます。</p>
            </div>

            <div class="row overlap-row">
              <label class="field">オーバーラップ
                <input type="number" id="overlap" value="0" min="0" step="50" inputmode="numeric" />
                <span class="unit">ms</span>
              </label>
              <span class="hint">各分割点の前後に付加します</span>
            </div>
          </div>

          <div class="card listcard">
            <div class="list-head">
              <h2>分割プレビュー <span class="badge" id="seg-count">0</span></h2>
              <label class="check"><input type="checkbox" id="loop-seg" /> ループ再生</label>
            </div>
            <div class="seg-list" id="seg-list"></div>
          </div>

          <div class="card exportcard">
            <h2>書き出し</h2>
            <div class="row">
              <label class="field">形式
                <select id="out-format">
                  <option value="same">入力と同じ</option>
                  <option value="mp3">MP3</option>
                  <option value="m4a">M4A (AAC)</option>
                  <option value="wav">WAV</option>
                </select>
              </label>
              <label class="field" id="quality-field">品質
                <select id="out-quality"></select>
              </label>
            </div>
            <div class="row">
              <button class="btn btn-primary btn-lg" id="export-btn" type="button">分割して書き出す</button>
              <button class="btn btn-ghost" id="zip-btn" type="button">ZIPでまとめて保存</button>
            </div>
            <div class="progress" id="progress" hidden>
              <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
              <div class="progress-text">
                <span id="progress-text"></span>
                <button class="btn btn-ghost btn-sm" id="cancel-btn" type="button">中止</button>
              </div>
            </div>
            <div class="results" id="results"></div>
          </div>
        </section>
      </main>

      <footer class="footer">
        <span>すべての処理は端末内で完結します。</span>
      </footer>
    </div>

    <div id="toast" class="toast" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
